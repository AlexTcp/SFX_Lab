<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SFX Lab — Sustained Bottom Panel</title>
<style>
  :root {
    --bg:        #121217;
    --panel:     #2D2D38;
    --widget:    #38384A;
    --widget-hi: #47475C;
    --accent:    #57AEF5;
    --danger:    #E65959;
    --text:      #FFFFFF;
    --text-mid:  rgba(255,255,255,0.78);
    --text-dim:  rgba(255,255,255,0.55);
    --rule:      rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0d;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 380px; background: var(--bg);
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  /* SOUND LIST */
  .list { height: 420px; overflow-y: auto; padding: 12px; }
  .row {
    display: flex; align-items: center;
    height: 44px; padding: 0 14px; margin-bottom: 4px;
    background: var(--widget); border-radius: 10px;
    font-size: 14px;
  }
  .row.selected { background: var(--widget-hi); }
  .ring {
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(255,255,255,0.18);
    margin-right: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .row.selected .ring::after {
    content: ""; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent);
  }

  /* PANEL */
  .panel { background: var(--panel); padding: 14px 18px 14px; }

  .section-head {
    display: flex; align-items: center; gap: 10px;
    height: 18px; margin-bottom: 8px;
  }
  .section-label {
    font-size: 10px; letter-spacing: 2.5px;
    color: var(--text-dim); font-weight: 700;
  }
  .section-rule { flex: 1; height: 1px; background: var(--rule); }

  .mod-row {
    display: flex; align-items: center;
    height: 26px; gap: 12px;
  }
  .mod-label {
    width: 70px;
    font-size: 11px; letter-spacing: 1.5px;
    color: var(--text-mid); font-weight: 700;
  }
  .slider {
    flex: 1; height: 24px; position: relative; cursor: pointer;
  }
  .slider .track {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%); height: 4px;
    background: var(--widget); border-radius: 2px;
  }
  .slider .fill {
    position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); height: 4px;
    background: var(--accent); border-radius: 2px;
  }
  .slider .handle {
    position: absolute; top: 50%;
    transform: translate(-50%, -50%);
    width: 16px; height: 16px; border-radius: 50%;
    background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  .mod-value {
    width: 48px; text-align: right;
    font-size: 12px; font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  /* ACTIONS */
  .actions {
    display: flex; gap: 8px;
    margin-top: 14px; height: 48px;
  }
  .btn {
    border: 0; border-radius: 10px; color: white;
    font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 1px; font-size: 15px;
  }
  .btn-play  { flex: 1;     background: var(--accent); }
  .btn-loop  { width: 48px;  background: var(--widget); font-size: 18px; }
  .btn-loop.on { background: var(--accent); }
  .btn-stop  { width: 96px;  background: var(--danger); }
</style>
</head>
<body>
  <div class="phone">
    <div class="list">
      <div class="row"><span class="ring"></span>Achievement</div>
      <div class="row"><span class="ring"></span>AcidSplash</div>
      <div class="row"><span class="ring"></span>Alarm</div>
      <div class="row"><span class="ring"></span>AlienLanguage</div>
      <div class="row"><span class="ring"></span>AmmoDrop</div>
      <div class="row"><span class="ring"></span>AncientRune</div>
      <div class="row"><span class="ring"></span>AntiGravity</div>
      <div class="row"><span class="ring"></span>ArcaneExplosion</div>
      <div class="row selected"><span class="ring"></span>BOSS_2</div>
    </div>

    <div class="panel">
      <div class="mod-row">
        <span class="mod-label">RELEASE</span>
        <div class="slider">
          <div class="track"></div>
          <div class="fill"   style="width: 25%"></div>
          <div class="handle" style="left: 25%"></div>
        </div>
        <span class="mod-value">0.5s</span>
      </div>

      <div class="actions">
        <button class="btn btn-play">▶ PLAY</button>
        <button class="btn btn-loop">↺</button>
        <button class="btn btn-stop">■ STOP</button>
      </div>
    </div>
  </div>
</body>
</html>
